<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вещи дома">
<title>Вещи дома</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;min-height:100vh;max-width:480px;margin:0 auto}
.hdr{background:#1e293b;padding:12px 16px;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.hdr h1{color:#fff;font-size:15px;font-weight:700}
.hdr-sub{color:#94a3b8;font-size:11px;margin-top:2px}
.btn-sm{background:#334155;border:none;color:#94a3b8;padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:100;padding:0 0 env(safe-area-inset-bottom)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 10px;border:none;background:none;cursor:pointer;font-family:inherit;color:#94a3b8;font-size:10px;gap:3px;transition:color .15s}
.nb .ni{font-size:22px;line-height:1}
.nb.act{color:#3b82f6}
.wrap{padding:12px 12px 90px}
.fsbar{display:flex;gap:6px;padding:8px 12px 4px;overflow-x:auto;scrollbar-width:none}
.fsbar::-webkit-scrollbar{display:none}
.ft{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;color:#64748b}
.ft.act{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
.aibtn{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#6366f1,#3b82f6);border:none;border-radius:14px;padding:14px 16px;width:calc(100% - 24px);margin:8px 12px 0;cursor:pointer;font-family:inherit;color:#fff;text-align:left}
.aibtn-t{font-size:13px;font-weight:700}
.aibtn-s{font-size:11px;opacity:.75;margin-top:1px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cphotos{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.cphotos::-webkit-scrollbar{display:none}
.cphotos img{width:120px;height:100px;object-fit:cover;border-radius:8px;flex-shrink:0}
.cphotos img:only-child{width:100%;height:160px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.cname{font-weight:600;font-size:14px;color:#1e293b}
.cdesc{font-size:12px;color:#64748b;margin-top:2px;line-height:1.4}
.cbadge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;border-width:1px;border-style:solid}
.bdel{padding:4px 9px;border-radius:8px;border:1px solid #fee2e2;background:#fff;color:#ef4444;font-size:13px;cursor:pointer;margin-left:6px}
.drow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.db{padding:4px 10px;border-radius:20px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid;font-family:inherit}
.bavito{width:100%;padding:10px;border-radius:10px;border:none;background:#f59e0b;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:6px}
.bavito:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.abox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-top:6px}
.abox-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:6px;flex-wrap:wrap}
.abox-l{font-size:12px;font-weight:700;color:#92400e}
.abox-acts{display:flex;gap:6px;flex-wrap:wrap}
.bcopy{padding:4px 11px;border-radius:8px;border:1px solid #fcd34d;background:#fff;color:#92400e;font-size:11px;cursor:pointer;font-family:inherit}
.bcopy.ok{background:#22c55e;color:#fff;border-color:#22c55e}
.bsave{padding:4px 11px;border-radius:8px;border:1px solid #93c5fd;background:#fff;color:#1d4ed8;font-size:11px;cursor:pointer;font-family:inherit}
.apre{font-size:12px;color:#451a03;white-space:pre-wrap;line-height:1.6;font-family:inherit}
.fwrap{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ftitle{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:12px}
.fwrap input,.fwrap select,.fwrap textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e2e8f0;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;background:#fff}
.fwrap input:focus,.fwrap select:focus,.fwrap textarea:focus{border-color:#3b82f6}
.fwrap textarea{resize:vertical;min-height:72px}
.pbtns{display:flex;gap:8px;margin-bottom:10px}
.pbtn{flex:1;padding:11px 8px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;font-size:13px;cursor:pointer;font-family:inherit;color:#64748b;text-align:center}
.pgrid{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pthumb{position:relative;width:80px;height:80px}
.pthumb img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.pdel{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rbtns{display:flex;gap:8px;margin-top:4px}
.bprim{flex:1;padding:11px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.bghost{padding:11px 16px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:14px;cursor:pointer;font-family:inherit}
.fab{position:fixed;bottom:74px;right:16px;width:52px;height:52px;background:#3b82f6;border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;z-index:99;transition:transform .1s}
.fab:active{transform:scale(.93)}
.empty{text-align:center;padding:48px 24px;color:#94a3b8}
.empty .emi{font-size:48px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.5}
.scard{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.scard h3{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:8px}
.scard p{font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.5}
.scard input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e2e8f0;font-size:13px;outline:none;font-family:inherit;background:#fff;margin-bottom:10px}
.scard input:focus{border-color:#3b82f6}
.kstat{font-size:12px;padding:6px 12px;border-radius:8px;margin-bottom:10px}
.kstat.ok{background:#f0fdf4;color:#16a34a}
.kstat.no{background:#fef2f2;color:#dc2626}
.stags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stag{background:#f1f5f9;border-radius:8px;padding:3px 10px;font-size:11px;color:#475569}
.advice-wrap{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:14px;margin-top:8px}
.advice-wrap h3{font-size:12px;font-weight:700;color:#0c4a6e;margin-bottom:8px}
.advice-text{font-size:12px;color:#0c4a6e;white-space:pre-wrap;line-height:1.7;font-family:inherit}
.tip-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tip-emo{font-size:28px;margin-bottom:8px}
.tip-ttl{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:6px}
.tip-txt{font-size:13px;color:#64748b;line-height:1.6}
.motiv{background:linear-gradient(135deg,#1e293b,#334155);border-radius:14px;padding:20px 16px;margin-bottom:12px;text-align:center}
.motiv h2{color:#fff;font-size:17px;margin-bottom:6px}
.motiv p{color:#94a3b8;font-size:12px;line-height:1.5}
.prow{display:flex;gap:8px;margin-top:14px}
.pitem{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:8px;text-align:center}
.pnum{color:#fff;font-size:22px;font-weight:700}
.plbl{color:#94a3b8;font-size:10px;margin-top:2px}
.notif{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.notif.show{opacity:1}
.svbadge{position:fixed;top:8px;right:16px;background:#22c55e;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;z-index:200;opacity:0;transition:opacity .3s}
.svbadge.show{opacity:1}
.hint{background:#f1f5f9;border-radius:10px;padding:8px 12px;font-size:11px;color:#64748b;margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<div class="notif" id="notif"></div>
<div class="svbadge" id="svbadge">💾 Сохранено</div>
<script>
function ld(k,def){try{const s=localStorage.getItem(k);return s?JSON.parse(s):def;}catch(e){return def;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){notify("Ошибка сохранения");}}
function getApiKey(){return localStorage.getItem("dcl_apikey")||"";}
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2);}

const ACTIONS=[
  {id:"keep",  label:"Оставить", c:"#16a34a",bg:"#f0fdf4"},
  {id:"sell",  label:"Продать",  c:"#d97706",bg:"#fffbeb"},
  {id:"donate",label:"Отдать",   c:"#7c3aed",bg:"#f5f3ff"},
  {id:"later", label:"Разобрать",c:"#6b7280",bg:"#f9fafb"},
  {id:"trash", label:"Выброс",   c:"#dc2626",bg:"#fef2f2"},
];

const SEASONS=[
  {id:"all",   label:"Все"},
  {id:"summer",label:"🌞 Лето"},
  {id:"winter",label:"❄️ Зима"},
  {id:"demi",  label:"🍂 Демисезон"},
  {id:"sport", label:"⚽ Спорт"},
];

const TIPS=[
  {e:"✨",t:"Правило «одно входит — одно выходит»",x:"Купила новую вещь? Сразу отдай или выброси старую. Так количество вещей никогда не растёт."},
  {e:"📅",t:"Правило 6 месяцев",x:"Не использовала вещь 6 месяцев? Скорее всего, не используешь и дальше. Смело отдавай — кому-то она нужнее."},
  {e:"💝",t:"Приносит ли радость?",x:"Метод Мари Кондо: возьми вещь в руки. Если не чувствуешь искренней радости — поблагодари за службу и отпусти."},
  {e:"💰",t:"Правило 20/20",x:"Если вещь стоит до 2000₽ и можно купить снова за 20 минут — смело выбрасывай. Не стоит хранить «на всякий случай»."},
  {e:"📦",t:"Сортируй по категориям, не по комнатам",x:"Собери все вещи одного типа вместе — увидишь реальное количество. Обычно оказывается, что их в 3 раза больше чем казалось."},
  {e:"⏱",t:"15 минут в день",x:"Не нужно разбирать всё за выходные. 15 минут ежедневно дают ощутимый результат за месяц. Поставь таймер прямо сейчас."},
  {e:"📸",t:"Сфотографируй — потом выброси",x:"Жалко расставаться с дорогой памятной вещью? Сделай фото — воспоминание останется, а место освободится."},
  {e:"🧺",t:"Коробка «на выход»",x:"Поставь у двери коробку. Когда видишь лишнюю вещь — сразу кладёшь туда. Наполнилась — везёшь в пункт приёма."},
  {e:"🎯",t:"Начни с самого лёгкого",x:"Первыми расхламляй явный мусор и дубли. Быстрый результат даёт мотивацию браться за сложные зоны."},
  {e:"👥",t:"Привлеки кого-то",x:"Попроси подругу помочь. Посторонний взгляд помогает отпустить вещи — она не знает историю каждой из них."},
];

let S={
  tab:"items",
  itemFilter:"all",
  shoeFilter:"all",
  items:ld("dcl2_items",[]),
  shoes:ld("dcl2_shoes",[]),
  storages:ld("dcl2_storages",[]),
  showForm:false,
  formType:null,
  formPhotos:[],
  editId:null,
  screen:"main",
  orgPhotos:[],
  orgAdvice:null,
  orgLoading:false,
};

function saveItems(){sv("dcl2_items",S.items);showSvBadge();}
function saveShoes(){sv("dcl2_shoes",S.shoes);showSvBadge();}
function saveStorages(){sv("dcl2_storages",S.storages);showSvBadge();}
function showSvBadge(){const el=document.getElementById("svbadge");el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1500);}
function notify(msg){const el=document.getElementById("notif");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200);}

function compressPhoto(file,cb){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const MAX=900;let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
      canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      cb(canvas.toDataURL("image/jpeg",0.78));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function processFiles(files){Array.from(files).forEach(f=>compressPhoto(f,d=>{S.formPhotos.push(d);render();}));}
function processOrgFiles(files){Array.from(files).forEach(f=>compressPhoto(f,d=>{S.orgPhotos.push(d);render();}));}

// ---- Shared UI ----

function renderNav(){
  const tabs=[{id:"items",i:"📋",l:"Вещи"},{id:"shoes",i:"👟",l:"Обувь"},{id:"storage",i:"📦",l:"Хранение"},{id:"tips",i:"💡",l:"Советы"}];
  return `<div class="bnav">${tabs.map(t=>`<button class="nb${S.tab===t.id?" act":""}" onclick="S.tab='${t.id}';S.showForm=false;S.formPhotos=[];render()"><span class="ni">${t.i}</span>${t.l}</button>`).join("")}</div>`;
}

function renderHdr(title,sub){
  return `<div class="hdr"><div class="hdr-row"><div><h1>${title}</h1>${sub?`<div class="hdr-sub">${sub}</div>`:""}</div><button class="btn-sm" onclick="S.screen='settings';render()">⚙️</button></div></div>`;
}

function renderFormPhotos(){
  const thumbs=S.formPhotos.map((p,i)=>`<div class="pthumb"><img src="${p}" alt=""><button class="pdel" onclick="S.formPhotos.splice(${i},1);render()">×</button></div>`).join("");
  return `<input type="file" id="fpGal" accept="image/*" multiple style="display:none">
<input type="file" id="fpCam" accept="image/*" capture="environment" style="display:none">
<div class="pbtns"><button class="pbtn" id="btnGal">🖼 Галерея</button><button class="pbtn" id="btnCam">📷 Камера</button></div>
${thumbs?`<div class="pgrid">${thumbs}</div>`:""}`;
}

// ---- ITEMS ----

function renderItems(){
  const all=S.items;
  const sell=all.filter(i=>i.status==="sell").length;
  const donate=all.filter(i=>i.status==="donate").length;
  const trash=all.filter(i=>i.status==="trash").length;
  const later=all.filter(i=>i.status==="later").length;
  const filters=[
    {id:"all",   label:`Все (${all.length})`},
    {id:"sell",  label:`Продать (${sell})`},
    {id:"donate",label:`Отдать (${donate})`},
    {id:"later", label:`Разобрать (${later})`},
  ];
  let shown=all;
  if(S.itemFilter!=="all") shown=all.filter(i=>i.status===S.itemFilter);

  let out=renderHdr("📋 Вещи дома",`${all.length} вещей · продать ${sell} · отдать ${donate} · выброс ${trash}`);
  out+=`<div class="fsbar">${filters.map(f=>`<button class="ft${S.itemFilter===f.id?" act":""}" onclick="S.itemFilter='${f.id}';render()">${f.label}</button>`).join("")}</div>`;
  out+=`<button class="aibtn" onclick="S.screen='org';S.orgAdvice=null;S.orgPhotos=[];render()">
    <span style="font-size:26px;flex-shrink:0">🤖</span>
    <div><div class="aibtn-t">Совет по организации</div><div class="aibtn-s">Загрузи фото — ИИ подскажет как лучше хранить</div></div>
  </button>`;
  out+=`<div class="wrap" style="padding-top:12px">`;
  if(S.showForm&&S.formType==="item") out+=renderItemForm();
  if(shown.length===0&&!S.showForm){
    out+=`<div class="empty"><div class="emi">📋</div><p>${S.itemFilter==="all"?"Нажми + чтобы добавить первую вещь":"Нет вещей в этой категории"}</p></div>`;
  } else out+=shown.map(renderItemCard).join("");
  out+=`</div>`;
  if(!S.showForm) out+=`<button class="fab" onclick="S.showForm=true;S.formType='item';S.formPhotos=[];render();setTimeout(()=>document.getElementById('fName')?.focus(),100)">+</button>`;
  return out+renderNav();
}

function renderItemForm(){
  return `<div class="fwrap" id="addForm">
<div class="ftitle">+ Добавить вещь</div>
${renderFormPhotos()}
<input id="fName" placeholder="Название *" type="text" autocomplete="off">
<input id="fDesc" placeholder="Описание (необязательно)" type="text" autocomplete="off">
<input id="fCond" placeholder="Состояние (напр: б/у 1 раз)" type="text" autocomplete="off">
<div class="rbtns">
  <button class="bprim" onclick="submitItemForm()">Добавить</button>
  <button class="bghost" onclick="S.showForm=false;S.formPhotos=[];render()">Отмена</button>
</div></div>`;
}

function renderItemCard(item){
  if(S.editId===item.id) return renderItemEditForm(item);
  const act=ACTIONS.find(a=>a.id===item.status);
  const isSell=item.status==="sell";
  const photos=item.photos||[];
  return `<div class="card">
${photos.length>0?`<div class="cphotos">${photos.map(p=>`<img src="${p}" alt="">`).join("")}</div>`:""}
<div class="chead">
  <div style="flex:1;min-width:0">
    <div class="cname">${esc(item.name)}</div>
    ${item.desc?`<div class="cdesc">${esc(item.desc)}</div>`:""}
    ${item.cond?`<div class="cdesc">Состояние: ${esc(item.cond)}</div>`:""}
  </div>
  <div style="display:flex;align-items:center;flex-shrink:0;margin-left:8px">
    ${act?`<span class="cbadge" style="background:${act.bg};color:${act.c};border-color:${act.c}44">${act.label}</span>`:""}
    <button class="btn-sm" onclick="S.editId='${item.id}';render()" style="margin-left:6px">✏️</button>
    <button class="bdel" onclick="delItem('${item.id}')">✕</button>
  </div>
</div>
<div class="drow">
${ACTIONS.map(a=>`<button class="db" onclick="updItem('${item.id}','status','${a.id}')" style="background:${item.status===a.id?a.bg:"#fff"};color:${item.status===a.id?a.c:"#94a3b8"};border-color:${item.status===a.id?a.c:"#e2e8f0"};font-weight:${item.status===a.id?700:400}">${a.label}</button>`).join("")}
</div>
${isSell?`<button class="bavito" id="avbtn_${item.id}" onclick="doAvito('${item.id}')">${item.avitoText?"🔄 Перегенерировать объявление":"📝 Текст для Авито"}</button>`:""}
${isSell&&item.avitoText?`<div class="abox">
  <div class="abox-h">
    <span class="abox-l">✅ Объявление готово</span>
    <div class="abox-acts">
      <button class="bcopy" id="cp_${item.id}" onclick="copyAvito('${item.id}')">📋 Копировать текст</button>
      ${photos.length>0?`<button class="bsave" onclick="savePhotos('${item.id}')">💾 Сохранить фото</button>`:""}
    </div>
  </div>
  <pre class="apre" id="pre_${item.id}">${esc(item.avitoText)}</pre>
</div>`:""}
</div>`;
}

function renderItemEditForm(item){
  return `<div class="fwrap" style="border:2px solid #3b82f6">
<div class="ftitle">✏️ Редактировать</div>
<input id="eItemName" type="text" value="${esc(item.name)}" autocomplete="off">

// ---- AI ----

async function callClaude(parts,maxTokens){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":getApiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:maxTokens||1000,messages:[{role:"user",content:parts}]})
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.[0]?.text||"";
}

function buildParts(photos,prompt){
  const parts=[];
  (photos||[]).slice(0,4).forEach(dataUrl=>{
    const b=dataUrl.split(",")[1];
    if(b) parts.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b}});
  });
  parts.push({type:"text",text:prompt});
  return parts;
}

async function doAvito(id){
  if(!getApiKey()){S.screen="settings";render();notify("Сначала введи API-ключ");return;}
  const btn=document.getElementById("avbtn_"+id);
  if(btn){btn.disabled=true;btn.textContent="⏳ Генерирую...";}
  const item=S.items.find(i=>i.id===id);
  if(!item) return;
  try{
    const photoNote=(item.photos||[]).length>0?"\n\nНа фото виден товар — используй изображения чтобы точнее описать предмет, его состояние и особенности. Если название расплывчатое — уточни по фото.":"";
    const prompt=`Напиши объявление для Авито.\nТовар: ${item.name||"см. фото"}\nОписание: ${item.desc||"нет"}\nСостояние: ${item.cond||"б/у, хорошее"}${photoNote}\n\nФормат строго:\nЗАГОЛОВОК: (до 50 символов)\nОПИСАНИЕ: (3–4 предложения честно, без воды)\nЦЕНА: (в рублях)\nТЕГИ: #тег1 #тег2 #тег3`;
    const text=await callClaude(buildParts(item.photos||[],prompt),1000);
    updItem(id,"avitoText",text);
    notify("✅ Объявление готово!");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Ошибка — попробовать снова";}
    notify("Ошибка: "+e.message);
  }
}

async function doStorageAdvice(id){
  if(!getApiKey()){S.screen="settings";render();notify("Сначала введи API-ключ");return;}
  const btn=document.getElementById("stbtn_"+id);
  if(btn){btn.disabled=true;btn.textContent="⏳ Анализирую...";}
  const stor=S.storages.find(s=>s.id===id);
  if(!stor) return;
  try{
    const prompt=`Ты эксперт по организации хранения.\n\nМесто: ${stor.name}\nРасположение: ${stor.location||"не указано"}\nСодержимое: ${stor.contents||"не описано"}\n${(stor.photos||[]).length>0?"На фото видно это место хранения.\n":""}\nДай конкретные практичные советы:\n1. Как лучше разложить вещи\n2. Что стоит убрать или переместить\n3. Какие органайзеры или ящики помогут\n4. Как быстро найти вещь в следующий раз\n\nКратко и по делу, на русском.`;
    const text=await callClaude(buildParts(stor.photos||[],prompt),800);
    const s=S.storages.find(st=>st.id===id);
    if(s){s.advice=text;saveStorages();render();}
    notify("✅ Совет готов!");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Ошибка — попробовать снова";}
    notify("Ошибка: "+e.message);
  }
}

async function doOrgAdvice(){
  if(!getApiKey()){S.screen="settings";render();notify("Сначала введи API-ключ");return;}
  if(!S.orgPhotos.length){notify("Сначала загрузи фото");return;}
  S.orgLoading=true;render();
  try{
    const ctx=document.getElementById("orgCtx")?.value||"";
    const prompt=`Ты эксперт по организации пространства.${ctx?"\n\nЗадача: "+ctx:""}\n\nПосмотри на фото и дай конкретные советы:\n1. Как лучше организовать это пространство\n2. Что убрать, переместить или добавить\n3. Простые решения (ящики, органайзеры, крючки)\n4. С чего начать прямо сейчас\n\nКратко, конкретно, на русском.`;
    const text=await callClaude(buildParts(S.orgPhotos,prompt),1000);
    S.orgAdvice=text;S.orgLoading=false;render();
    notify("✅ Совет готов!");
  }catch(e){
    S.orgLoading=false;render();notify("Ошибка: "+e.message);
  }
}

function copyAvito(id){
  const pre=document.getElementById("pre_"+id);
  const btn=document.getElementById("cp_"+id);
  if(!pre||!btn)return;
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    btn.textContent="✓ Скопировано!";btn.classList.add("ok");
    setTimeout(()=>{btn.textContent="📋 Копировать текст";btn.classList.remove("ok");},2500);
    notify("📋 Текст скопирован!");
  });
}

function savePhotos(id){
  const item=S.items.find(i=>i.id===id);
  if(!item||!item.photos?.length) return;
  item.photos.forEach((dataUrl,idx)=>{
    const a=document.createElement("a");
    a.href=dataUrl;
    a.download=`avito_${(item.name||"photo").replace(/[^\w]/g,"_")}_${idx+1}.jpg`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
  notify(`💾 Сохраняю ${item.photos.length} фото в галерею`);
}

function saveApiKey(){
  const inp=document.getElementById("apiKeyInput");if(!inp)return;
  const val=inp.value.trim();
  if(!val||val.startsWith("●")){notify("Введи новый ключ");return;}
  localStorage.setItem("dcl_apikey",val);notify("✅ Ключ сохранён!");render();
}

render();
</script>
