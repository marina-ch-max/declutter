<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расхламление">
<title>Расхламление</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;min-height:100vh;max-width:480px;margin:0 auto}
.hdr{background:#1e293b;padding:12px 16px;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.hdr h1{color:#fff;font-size:15px;font-weight:700}
.hdr-sub{color:#94a3b8;font-size:11px;margin-top:2px}
.btn-sm{background:#334155;border:none;color:#94a3b8;padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.zone-scroll{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none}
.zone-scroll::-webkit-scrollbar{display:none}
.zone-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:#64748b;white-space:nowrap;transition:all .15s}
.zone-tab.active{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
.zone-tab .badge{display:inline-block;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;margin-left:4px;line-height:16px}
.zone-tab.active .badge{background:rgba(255,255,255,.3)}
.content{padding:0 12px 100px}
.fab{position:fixed;bottom:20px;right:16px;width:52px;height:52px;background:#3b82f6;border:none;border-radius:50%;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;z-index:99;transition:transform .1s}
.fab:active{transform:scale(.93)}
.empty{text-align:center;padding:48px 24px;color:#94a3b8}
.empty .em{font-size:48px;margin-bottom:12px}
.empty p{font-size:13px;line-height:1.5}
.hint{background:#f1f5f9;border-radius:10px;padding:10px 14px;font-size:12px;color:#64748b;margin-top:12px;text-align:left}
.form-wrap{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.form-wrap input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e2e8f0;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit;background:#fff}
.form-wrap input:focus{border-color:#3b82f6}
.form-title{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:12px}
.photo-area{border:2px dashed #cbd5e1;border-radius:10px;padding:16px;text-align:center;color:#64748b;font-size:13px;cursor:pointer;margin-bottom:10px;transition:border-color .15s}
.photo-area:hover{border-color:#94a3b8}
.photo-area img{max-height:120px;border-radius:8px;max-width:100%}
.row-btns{display:flex;gap:8px}
.btn-primary{flex:1;padding:11px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-ghost{padding:11px 16px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-size:14px;cursor:pointer;font-family:inherit}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-name{font-weight:600;font-size:14px;color:#1e293b}
.card-desc{font-size:12px;color:#64748b;margin-top:2px}
.card-badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;border-width:1px;border-style:solid}
.btn-del{padding:4px 9px;border-radius:8px;border:1px solid #fee2e2;background:#fff;color:#ef4444;font-size:13px;cursor:pointer;margin-left:6px}
.dec-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.dec-btn{padding:4px 11px;border-radius:20px;font-size:12px;cursor:pointer;border-width:1px;border-style:solid;font-family:inherit;transition:all .1s}
.btn-avito{width:100%;padding:10px;border-radius:10px;border:none;background:#f59e0b;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-avito:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.avito-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;margin-top:10px}
.avito-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.avito-lbl{font-size:12px;font-weight:700;color:#92400e}
.btn-copy{padding:4px 12px;border-radius:8px;border:1px solid #fcd34d;background:#fff;color:#92400e;font-size:12px;cursor:pointer;font-family:inherit}
.btn-copy.ok{background:#22c55e;color:#fff;border-color:#22c55e}
.avito-pre{font-size:12px;color:#451a03;white-space:pre-wrap;line-height:1.6;font-family:inherit}
.stats-wrap{padding:0 12px 100px}
.stats-card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.stats-card h3{font-weight:700;font-size:14px;color:#1e293b;margin-bottom:12px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f8fafc}
.stat-row:last-child{border:none}
.stat-num{border-radius:20px;padding:3px 14px;font-size:13px;font-weight:700;border-width:1px;border-style:solid}
.avito-item{padding:10px 0;border-bottom:1px solid #f8fafc}
.avito-item:last-child{border:none}
.avito-item-name{font-weight:600;font-size:13px;color:#1e293b}
.avito-item-prev{font-size:11px;color:#64748b;margin-top:3px;line-height:1.5}
.notif{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.notif.show{opacity:1}
.save-badge{position:fixed;top:8px;right:60px;background:#22c55e;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;z-index:200;opacity:0;transition:opacity .3s}
.save-badge.show{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<div class="notif" id="notif"></div>
<div class="save-badge" id="saveBadge">💾 Сохранено</div>

<script>
const ZONES=[
  {id:"room",label:"🛏 Комната",icon:"🛏",hint:"Смотри глазами гостя: что лишнее?"},
  {id:"wardrobe",label:"👕 Шкаф",icon:"👕",hint:"Доставай всё на кровать — сортируй кучей"},
  {id:"dresser",label:"🗄 Комод",icon:"🗄",hint:"Каждый ящик — отдельная сессия"},
  {id:"bed",label:"📦 Ящик кровати",icon:"📦",hint:"Достань всё — там обычно залежи давно забытого"},
  {id:"notes",label:"📓 Тетради",icon:"📓",hint:"Ценное — сфоткай страницы → тетрадь выброси"},
  {id:"storage",label:"🏚 Кладовка",icon:"🏚",hint:"Открывала ли это за последний год?"},
  {id:"balcony",label:"🌿 Балкон",icon:"🌿",hint:"Всё что просто «стоит» — кандидат на выброс"},
  {id:"kitchen",label:"🍳 Кухня",icon:"🍳",hint:"Не используется >6 мес? Дубли посуды и техники?"},
  {id:"bath",label:"🪥 Ванная",icon:"🪥",hint:"Просроченная косметика, дубли — сразу выброс"},
  {id:"shoes",label:"👟 Обувь",icon:"👟",hint:"Сезон, состояние, когда последний раз носила?"},
  {id:"avito",label:"💰 На продажу",icon:"💰",hint:"Добавь фото — сгенерирую текст объявления"},
];

const DECS=[
  {id:"keep",label:"Оставить",color:"#16a34a",bg:"#f0fdf4"},
  {id:"sell",label:"Продать",color:"#d97706",bg:"#fffbeb"},
  {id:"donate",label:"Отдать",color:"#7c3aed",bg:"#f5f3ff"},
  {id:"trash",label:"Выброс",color:"#dc2626",bg:"#fef2f2"},
  {id:"later",label:"Позже",color:"#6b7280",bg:"#f9fafb"},
];

// --- Persistence ---
function loadItems(){
  try{const s=localStorage.getItem("dcl_v1");return s?JSON.parse(s):{};}
  catch(e){return{};}
}
function saveItems(){
  try{
    // Сохраняем без фото (они тяжёлые) — только метаданные + avitoText
    const slim={};
    for(const z in S.items){
      slim[z]=S.items[z].map(i=>({...i,photo:i.photo?"__has_photo__":null}));
    }
    localStorage.setItem("dcl_v1",JSON.stringify(slim));
    showSaveBadge();
  }catch(e){
    // Если нет места — сохраняем без фото
    try{
      const noPhoto={};
      for(const z in S.items){
        noPhoto[z]=S.items[z].map(({photo,...rest})=>rest);
      }
      localStorage.setItem("dcl_v1",JSON.stringify(noPhoto));
    }catch(e2){}
  }
}

// Версия с фото хранится в памяти сессии, текст — в localStorage
let photoCache={}; // id -> base64

function saveItemsFull(){
  try{
    const full={};
    for(const z in S.items){
      full[z]=S.items[z].map(i=>({...i}));
    }
    localStorage.setItem("dcl_v1",JSON.stringify(full));
    showSaveBadge();
  }catch(e){
    // localStorage переполнен (фото занимают много места) — сохраняем без фото
    try{
      const noPhoto={};
      for(const z in S.items){
        noPhoto[z]=S.items[z].map(i=>{
          const {photo,...rest}=i;
          if(photo) photoCache[i.id]=photo;
          return {...rest,hasPhoto:!!photo};
        });
      }
      localStorage.setItem("dcl_v1",JSON.stringify(noPhoto));
      showSaveBadge();
      notify("Данные сохранены (фото только в этой сессии)");
    }catch(e2){
      notify("Ошибка сохранения — возможно, мало памяти браузера");
    }
  }
}

function getPhoto(item){
  return item.photo||(photoCache[item.id]||null);
}

let S={screen:"items",zone:"room",items:loadItems(),showForm:false,formPhoto:null};

function showSaveBadge(){
  const el=document.getElementById("saveBadge");
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),1500);
}

function notify(msg){
  const el=document.getElementById("notif");
  el.textContent=msg;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}

function all(){return Object.values(S.items).flat();}
function zItems(){return S.items[S.zone]||[];}
function tots(){return DECS.reduce((a,d)=>{a[d.id]=all().filter(i=>i.dec===d.id).length;return a},{});}

async function genAvito(item){
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
      messages:[{role:"user",content:`Напиши объявление для Авито.\nТовар: ${item.name}\nОписание: ${item.desc||"нет"}\nСостояние: ${item.cond||"б/у, хорошее"}\n\nФормат строго:\nЗАГОЛОВОК: (до 50 символов)\nОПИСАНИЕ: (3–4 предложения честно, без воды)\nЦЕНА: (в рублях)\nТЕГИ: #тег1 #тег2 #тег3`}]})
  });
  const d=await r.json();
  return d.content?.[0]?.text||"Ошибка генерации. Попробуй ещё раз.";
}

function upd(id,patch){
  for(const z in S.items){
    const idx=S.items[z].findIndex(i=>i.id===id);
    if(idx>=0){S.items[z][idx]={...S.items[z][idx],...patch};break;}
  }
  saveItemsFull();
  render();
}

function del(id){
  for(const z in S.items) S.items[z]=S.items[z].filter(i=>i.id!==id);
  delete photoCache[id];
  saveItemsFull();
  render();
}

function renderHeader(){
  const a=all(),t=tots();
  return `<div class="hdr">
    <div class="hdr-row">
      <div><h1>🏠 Расхламление</h1>
        <div class="hdr-sub">${a.length} предм. · продать ${t.sell||0} · выбросить ${t.trash||0}</div>
      </div>
      <button class="btn-sm" onclick="S.screen=S.screen==='stats'?'items':'stats';render()">
        ${S.screen==="stats"?"◀ Назад":"📊 Итоги"}
      </button>
    </div>
  </div>`;
}

function renderZoneTabs(){
  return `<div class="zone-scroll">${ZONES.map(z=>{
    const cnt=(S.items[z.id]||[]).length;
    return `<button class="zone-tab${S.zone===z.id?" active":""}"
      onclick="S.zone='${z.id}';S.showForm=false;render()">
      ${z.label}${cnt>0?`<span class="badge">${cnt}</span>`:""}
    </button>`;
  }).join("")}</div>`;
}

function renderForm(){
  const zInfo=ZONES.find(z=>z.id===S.zone);
  return `<div class="form-wrap" id="addForm">
    <div class="form-title">+ Добавить предмет</div>
    ${zInfo.hint?`<div class="hint" style="margin-bottom:12px">💡 ${zInfo.hint}</div>`:""}
    <input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none">
    <div class="photo-area" id="photoDrop">
      ${S.formPhoto?`<img src="${S.formPhoto}" alt="">`:"📷 Добавить фото (необязательно)"}
    </div>
    <input id="fName" placeholder="Название *" type="text" autocomplete="off">
    <input id="fDesc" placeholder="Описание (необязательно)" type="text" autocomplete="off">
    <input id="fCond" placeholder="Состояние (напр: б/у 1 раз)" type="text" autocomplete="off">
    <div class="row-btns">
      <button class="btn-primary" onclick="submitForm()">Добавить</button>
      <button class="btn-ghost" onclick="S.showForm=false;S.formPhoto=null;render()">Отмена</button>
    </div>
  </div>`;
}

function renderCard(item){
  const dec=DECS.find(d=>d.id===item.dec);
  const isSell=item.dec==="sell"||item.zone==="avito";
  const photo=getPhoto(item);
  return `<div class="card">
    ${photo?`<img class="card-img" src="${photo}" alt="">`:""}
    <div class="card-head">
      <div style="flex:1;min-width:0">
        <div class="card-name">${esc(item.name)}</div>
        ${item.desc?`<div class="card-desc">${esc(item.desc)}</div>`:""}
        ${item.cond?`<div class="card-desc">Состояние: ${esc(item.cond)}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;flex-shrink:0;margin-left:8px">
        ${dec?`<span class="card-badge" style="background:${dec.bg};color:${dec.color};border-color:${dec.color}44">${dec.label}</span>`:""}
        <button class="btn-del" onclick="del('${item.id}')">✕</button>
      </div>
    </div>
    <div class="dec-row">
      ${DECS.map(d=>`<button class="dec-btn" onclick="upd('${item.id}',{dec:'${d.id}'})"
        style="background:${item.dec===d.id?d.bg:"#fff"};color:${item.dec===d.id?d.color:"#94a3b8"};
               border-color:${item.dec===d.id?d.color:"#e2e8f0"};font-weight:${item.dec===d.id?700:400}">
        ${d.label}</button>`).join("")}
    </div>
    ${isSell?`<button class="btn-avito" id="avbtn_${item.id}" onclick="doAvito('${item.id}')">
      ${item.avitoText?"🔄 Перегенерировать":"📝 Текст для Авито"}
    </button>`:""}
    ${item.avitoText?`<div class="avito-box">
      <div class="avito-head">
        <span class="avito-lbl">✅ Объявление готово</span>
        <button class="btn-copy" id="cp_${item.id}" onclick="copyAvito('${item.id}')">Копировать</button>
      </div>
      <pre class="avito-pre" id="pre_${item.id}">${esc(item.avitoText)}</pre>
    </div>`:""}
  </div>`;
}

function renderItems(){
  const items=zItems();
  const zInfo=ZONES.find(z=>z.id===S.zone);
  let body="";
  if(S.showForm) body+=renderForm();
  if(items.length===0&&!S.showForm){
    body+=`<div class="empty">
      <div class="em">${zInfo.icon}</div>
      <p>Нажми + чтобы добавить первый предмет</p>
      ${zInfo.hint?`<div class="hint">💡 ${zInfo.hint}</div>`:""}
    </div>`;
  } else {
    body+=items.map(renderCard).join("");
  }
  return `${renderHeader()}${renderZoneTabs()}
    <div class="content">${body}</div>
    ${!S.showForm?`<button class="fab" onclick="S.showForm=true;render();setTimeout(()=>document.getElementById('fName')?.focus(),100)">+</button>`:""}`;
}

function renderStats(){
  const a=all(),t=tots();
  const sellReady=a.filter(i=>i.dec==="sell"&&i.avitoText);
  return `${renderHeader()}
    <div class="stats-wrap">
      <div class="stats-card">
        <h3>По решениям (${a.length} всего)</h3>
        ${DECS.map(d=>`<div class="stat-row">
          <span style="color:${d.color};font-weight:500;font-size:14px">${d.label}</span>
          <span class="stat-num" style="background:${d.bg};color:${d.color};border-color:${d.color}44">${t[d.id]||0}</span>
        </div>`).join("")}
      </div>
      <div class="stats-card">
        <h3>По зонам</h3>
        ${ZONES.filter(z=>(S.items[z.id]||[]).length>0).map(z=>`
          <div class="stat-row">
            <span style="font-size:13px">${z.label}</span>
            <span style="color:#64748b;font-size:13px">${(S.items[z.id]||[]).length} шт.</span>
          </div>`).join("")}
        ${a.length===0?`<div style="color:#94a3b8;font-size:13px;padding:8px 0">Пока пусто</div>`:""}
      </div>
      ${sellReady.length>0?`<div class="stats-card">
        <h3 style="color:#92400e">💰 Готовые объявления (${sellReady.length})</h3>
        ${sellReady.map(i=>`<div class="avito-item">
          <div class="avito-item-name">${esc(i.name)}</div>
          <div class="avito-item-prev">${esc((i.avitoText||"").slice(0,130))}...</div>
        </div>`).join("")}
      </div>`:""}
      <div class="stats-card" style="text-align:center">
        <button onclick="if(confirm('Очистить все данные?')){localStorage.removeItem('dcl_v1');S.items={};render()}" 
          style="padding:8px 20px;border-radius:10px;border:1px solid #fee2e2;background:#fff;color:#ef4444;font-size:13px;cursor:pointer;font-family:inherit">
          🗑 Очистить все данные
        </button>
      </div>
    </div>`;
}

function render(){
  document.getElementById("root").innerHTML=S.screen==="stats"?renderStats():renderItems();
  attachFormEvents();
}

function attachFormEvents(){
  const drop=document.getElementById("photoDrop");
  const inp=document.getElementById("fPhoto");
  if(drop&&inp){
    drop.addEventListener("click",()=>inp.click());
    inp.addEventListener("change",e=>{
      const f=e.target.files[0];
      if(!f)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        // Сжимаем фото перед сохранением
        const img=new Image();
        img.onload=()=>{
          const canvas=document.createElement("canvas");
          const MAX=800;
          let w=img.width,h=img.height;
          if(w>MAX){h=h*MAX/w;w=MAX;}
          if(h>MAX){w=w*MAX/h;h=MAX;}
          canvas.width=w;canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          S.formPhoto=canvas.toDataURL("image/jpeg",0.75);
          render();
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(f);
    });
  }
  const fn=document.getElementById("fName");
  if(fn) fn.addEventListener("keydown",e=>{if(e.key==="Enter")submitForm();});
}

function submitForm(){
  const name=document.getElementById("fName")?.value?.trim();
  if(!name){document.getElementById("fName")?.focus();return;}
  const desc=document.getElementById("fDesc")?.value||"";
  const cond=document.getElementById("fCond")?.value||"";
  const id=Date.now()+"_"+Math.random().toString(36).slice(2);
  const item={
    id,name,desc,cond,
    photo:S.formPhoto,
    zone:S.zone,
    dec:S.zone==="avito"?"sell":null,
    avitoText:null,
  };
  S.items[S.zone]=[...(S.items[S.zone]||[]),item];
  S.showForm=false;S.formPhoto=null;
  saveItemsFull();
  render();
  notify("✓ Добавлено: "+name);
}

async function doAvito(id){
  const btn=document.getElementById("avbtn_"+id);
  if(!btn)return;
  btn.disabled=true;btn.textContent="Генерирую...";
  let item;
  for(const z in S.items){const f=S.items[z].find(i=>i.id===id);if(f){item=f;break;}}
  if(!item){if(btn){btn.disabled=false;}return;}
  try{
    const text=await genAvito(item);
    upd(id,{avitoText:text});
    notify("✅ Объявление готово!");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Ошибка — попробовать снова";}
  }
}

function copyAvito(id){
  const pre=document.getElementById("pre_"+id);
  const btn=document.getElementById("cp_"+id);
  if(!pre||!btn)return;
  navigator.clipboard.writeText(pre.textContent).then(()=>{
    btn.textContent="✓ Скопировано!";btn.classList.add("ok");
    setTimeout(()=>{btn.textContent="Копировать";btn.classList.remove("ok");},2500);
    notify("📋 Текст скопирован!");
  });
}

function esc(s){
  if(!s)return"";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

render();
