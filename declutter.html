  {sec:"🚀 Как начать",color:"#6366f1",tips:[

    {e:"🗂",t:"Собери по категориям",x:"Собери ВСЕ вещи одного типа в одно место (все свитеры, все кабели, все книги). Обычно их в 3× больше чем казалось — это и есть повод расстаться с лишним."}

function ld(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}

function esc(s){if(!s)return"";return(""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function md2html(s){
  if(!s)return"";
  // tables
  s=s.replace(/^(\|.+\|)\r?\n\|[-|: ]+\|\r?\n((?:\|.+\|?[\r\n]?)*)/gm,function(m,hdr,rows){
    var ths=hdr.replace(/^\||\|$/g,"").split("|").map(function(c){return "<th>"+c.trim()+"</th>";}).join("");
    var trs=rows.trim().split("\n").map(function(r){r=r.trim();if(!r)return "";return "<tr>"+r.replace(/^\||\|?$/g,"").split("|").map(function(c){return "<td>"+c.replace(/\*\*/g,"").trim()+"</td>";}).join("")+"</tr>";}).join("");
    return '<table style="width:100%;border-collapse:collapse;font-size:13px;margin:8px 0">'+
      '<thead><tr style="background:#e0f2fe">'+ths+'</tr></thead><tbody>'+trs+'</tbody></table>';
  });
  // headings
  s=s.replace(/^### (.+)$/gm,"<h4 style='margin:10px 0 4px;font-size:14px;color:#1e293b'>$1</h4>");
  s=s.replace(/^## (.+)$/gm,"<h3 style='margin:12px 0 6px;font-size:15px;color:#1e293b'>$1</h3>");
  s=s.replace(/^# (.+)$/gm,"<h2 style='margin:8px 0 6px;font-size:16px;color:#1e293b'>$1</h2>");
  // bold
  s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  // bullet lists
  s=s.replace(/((?:^[-*] .+\n?)+)/gm,function(m){
    var items=m.trim().split("\n").map(function(l){return "<li>"+l.replace(/^[-*] /,"")+"</li>";}).join("");
    return '<ul style="margin:6px 0;padding-left:18px;font-size:13px">'+items+'</ul>';
  });
  // numbered lists
  s=s.replace(/((?:^\d+\. .+\n?)+)/gm,function(m){
    var items=m.trim().split("\n").map(function(l){return "<li>"+l.replace(/^\d+\. /,"")+"</li>";}).join("");
    return '<ol style="margin:6px 0;padding-left:18px;font-size:13px">'+items+'</ol>';
  });
  // line breaks
  s=s.replace(/\n{2,}/g,"</p><p style='margin:6px 0'>");
  s=s.replace(/\n/g,"<br>");
  return "<p style='margin:0'>"+s+"</p>";
}

function rAllItems(){
  var q=(S.gquery||"").toLowerCase().trim();

           :S.items;
  var o='<div class="hdr"><div class="hdr-row"><div><h1>📋 Все вещи</h1><div class="hdr-sub">'+S.items.length+' вещей</div></div><button class="bsm" onclick="S.scr=\'main\';S.gquery=\'\';R()">✕</button></div></div>';
  o+='<div style="padding:8px 12px 0"><div style="display:flex;align-items:center;background:#f1f5f9;border-radius:10px;padding:8px 12px;gap:8px"><span>🔍</span><input id="aiq" style="border:none;background:transparent;width:100%;font-size:14px;outline:none;font-family:inherit" placeholder="Фильтр по названию..." value="'+esc(S.gquery||"")+'" oninput="S.gquery=this.value;R()"></div></div>';
  o+='<div style="padding:8px 12px 80px">';
  if(!all.length) o+='<div class="empty"><div class="emi">📋</div><p>'+(q?"Ничего не найдено":"Нет вещей")+'</p></div>';
  all.forEach(function(it){
    var stlnk=null;if(it.stor_id){for(var j=0;j<S.stor.length;j++){if(S.stor[j].id===it.stor_id){stlnk=S.stor[j];break;}}}
    var ACT2=[{id:"sell",l:"Продать",b:"#fef3c7",c:"#d97706"},{id:"donate",l:"Отдать",b:"#dbeafe",c:"#2563eb"},{id:"trash",l:"Выброс",b:"#fee2e2",c:"#dc2626"},{id:"later",l:"Разобрать",b:"#f3f4f6",c:"#6b7280"}];
    var act=null;for(var k=0;k<ACT2.length;k++){if(ACT2[k].id===it.s){act=ACT2[k];break;}}
    var ph=it.photos||[];
    o+='<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9;align-items:flex-start">';
    if(ph.length) o+='<div style="flex-shrink:0;width:72px;height:72px;border-radius:10px;overflow:hidden"><img src="'+ph[0]+'" style="width:100%;height:100%;object-fit:cover"></div>';
    else o+='<div style="flex-shrink:0;width:72px;height:72px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:28px">📦</div>';
    o+='<div style="flex:1;min-width:0">';
    o+='<div style="font-size:15px;font-weight:600;color:#1e293b;margin-bottom:3px">'+esc(it.name)+'</div>';
    if(it.desc) o+='<div style="font-size:12px;color:#64748b;margin-bottom:3px">'+esc(it.desc)+'</div>';
    if(stlnk) o+='<div style="font-size:12px;color:#0ea5e9;margin-bottom:3px">📦 '+esc(stlnk.name)+(stlnk.loc?' · <span style="color:#94a3b8">'+esc(stlnk.loc)+'</span>':'')+'</div>';
    if(act) o+='<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:'+act.b+';color:'+act.c+';font-weight:600">'+act.l+'</span>';
    o+='</div></div>';
  });
  o+='</div>';
  return o+nav();
}

function toggleBought(id){
  var it=S.shopping.find(function(x){return x.id===id;});
  if(it) it.bought=!it.bought;
  svShop(); R();
}
function delShopItem(id){
  if(!confirm('Удалить?')) return;
  S.shopping=S.shopping.filter(function(x){return x.id!==id;});
  svShop(); R();
}
function clearBought(){
  if(!confirm('Убрать все купленные?')) return;
  S.shopping=S.shopping.filter(function(x){return !x.bought;});
  svShop(); R();
}
function startEditShop(id){S.shopEdit=id;R();}
function saveEditShop(id){
  var it=S.shopping.find(function(x){return x.id===id;});
  if(!it) return;
  var n=(document.getElementById('shed_n')||{value:''}).value.trim();
  var note=(document.getElementById('shed_nt')||{value:''}).value.trim();
  var sid=(document.getElementById('shed_s')||{value:''}).value;
  if(!n) return;
  it.name=n; it.note=note; it.storId=sid;
  svShop(); S.shopEdit=null; R();

function exportJSON(){
  var data={items:S.items,shoes:S.shoes,stor:S.stor,v:2,exported:new Date().toISOString()};
  var json=JSON.stringify(data);
  var blob=new Blob([json],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  var d=new Date();
  a.download="home_backup_"+d.getFullYear()+""+("0"+(d.getMonth()+1)).slice(-2)+""+("0"+d.getDate()).slice(-2)+".json";
  a.click();
  URL.revokeObjectURL(url);
  ntf("Файл скачан!");
}

function importJSON(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data.items&&!data.shoes&&!data.stor){ntf("Неверный формат файла");return;}
      if(!confirm("Загрузить данные? Текущие данные будут заменены.\n"+
        "Вещей: "+(data.items||[]).length+
        "\nОбуви: "+(data.shoes||[]).length+
        "\nМест хранения: "+(data.stor||[]).length))return;
      if(data.items)S.items=data.items;
      if(data.shoes)S.shoes=data.shoes;
      if(data.stor)S.stor=data.stor;
      svi();svs();svst();R();ntf("Данные загружены ✓");
    }catch(err){ntf("Ошибка: неверный формат файла");}
  };
  reader.readAsText(file);
  input.value="";
}

function addCartBtns(html,storId){
  var sid=storId||"";
  var bs="background:#6366f1;color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap";
  // Найти секцию «Что докупить» и обрабатывать только её
  var dokIdx=html.search(/докупить/i);
  if(dokIdx<0)return html;
  // Конец заголовка содержащего «докупить»
  var closeTag=html.indexOf('</h',dokIdx);
  var sectionStart=closeTag>0?html.indexOf('>',closeTag)+1:dokIdx;
  var before=html.slice(0,sectionStart);
  var rest=html.slice(sectionStart);
  // Следующий крупный заголовок h2/h3 — граница секции
  var nextHdr=rest.search(/<h[23][^>]*>/);
  var after='';
  if(nextHdr>0){after=rest.slice(nextHdr);rest=rest.slice(0,nextHdr);}
  // 1. Таблицы: доб. пустой th в шапку и кнопку в каждую строку тела
  rest=rest.replace(/(<thead>)(<tr[^>]*>)([\s\S]*?)(<\/tr>)(<\/thead>)/g,function(m,a,b,c,d,e){
    return a+b+c+"<th></th>"+d+e;
  });
  rest=rest.replace(/<tbody>([\s\S]*?)<\/tbody>/g,function(m,tbody){
    var rows=tbody.replace(/<tr>([\s\S]*?)<\/tr>/g,function(m2,cells){
      var nm=cells.match(/<td>([\s\S]*?)<\/td>/);
      if(!nm)return m2;
      var name=nm[1].replace(/<[^>]*>/g,"").replace(/\[\s*\]/g,"").trim().split("—")[0].split(" - ")[0].split(" – ")[0].trim();
      if(!name)return m2;
      var ename=encodeURIComponent(name);
      return "<tr>"+cells+'<td style="text-align:center;padding:4px 6px"><button onclick="addShopFromAdvText(decodeURIComponent(\''+ename+'\'),\''+sid+'\')" style="'+bs+'">🛒</button></td></tr>';
    });
    return "<tbody>"+rows+"</tbody>";
  });
  // 2. Элементы <li> (формат [ ] текст или обычный)
  rest=rest.replace(/<li>([\s\S]*?)<\/li>/g,function(m,item){
    var name=item.replace(/<[^>]*>/g,"").replace(/^\[\s*\]\s*/,"").trim().split("—")[0].split(" - ")[0].split("(")[0].trim();
    if(!name)return m;
    var ename=encodeURIComponent(name);
    return '<li>'+item+' <button onclick="addShopFromAdvText(decodeURIComponent(\''+ename+'\'),\''+sid+'\')" style="'+bs+'">🛒</button></li>';
  });
  // 3. Пункты с символом • (формат doStorAdv)
  rest=rest.replace(/•\s*([^•<\n][^\n<]*)/g,function(m,item){
    var name=item.split("—")[0].split(" - ")[0].split(" – ")[0].trim();
    var ename=encodeURIComponent(name);
    return "• "+item+' <button onclick="addShopFromAdvText(decodeURIComponent(\''+ename+'\'),\''+sid+'\')" style="'+bs+'">🛒</button>';
  });
  return before+rest+after;
}

function parseAvito(text){
  if(!text)return null;
  var res={title:"",desc:"",price:"",tags:"",tip:"",raw:text};
  var lines=text.split('\n');
  var cur="";
  lines.forEach(function(l){
    var m;
    // Match both "ЗАГОЛОВОК: text" and "# ЗАГОЛОВОК:" (with optional **)
    var clean=l.replace(/^#+\s+/,'').replace(/\*\*/g,'').trim();
    if((m=clean.match(/^ЗАГОЛОВОК:?\s*(.*)/i))){res.title=m[1].trim();cur="title";}
    else if((m=clean.match(/^ОПИСАНИЕ:?\s*(.*)/i))){res.desc=m[1].trim();cur="desc";}
    else if((m=clean.match(/^ЦЕНА:?\s*(.*)/i))){res.price=m[1].trim();cur="price";}
    else if((m=clean.match(/^ТЕГИ:?\s*(.*)/i))){res.tags=m[1].trim();cur="tags";}
    else if((m=clean.match(/^СОВЕТ:?\s*(.*)/i))){res.tip=m[1].trim();cur="tip";}
    else if(clean){
      if(cur==="title"&&!res.title)res.title=clean;
      else if(cur==="desc")res.desc+=(res.desc?"\n":"")+clean;
      else if(cur==="price")res.price+=(res.price?" ":"")+clean;
      else if(cur==="tags")res.tags+=(res.tags?" ":"")+clean;
      else if(cur==="tip")res.tip+=(res.tip?" ":"")+clean;
    }
  });
  if(!res.title&&!res.price) return null;
  return res;
}

function avCopyText(id){

}
